# Config de slf4j-simple: Hibernate y Flyway son muy verbosos en INFO; la demo y los tests quedan legibles con WARN.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
# Aviso de "pool integrado de Hibernate, no apto para produccion": es esperado en la demo y los tests.
org.slf4j.simpleLogger.log.org.hibernate.orm.connections.pooling=error
